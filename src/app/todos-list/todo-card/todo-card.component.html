<h4>Заголовок</h4>
<div class="todos_description">
    {{todo.userId}}
</div>

<h4>Описание задачи</h4>
<div class="todos_description">
    {{todo.title}}
</div>

<h4>Задача завершена:</h4>
<div class="todos_description">
    {{todo.completed ? 'ДА' : 'НЕТ'}}
</div>

<button (click)="onDeleteTodo(todo.id)" class="todos_button">Удалить задачу</button>
