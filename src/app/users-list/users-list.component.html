<div class="users-list container">
    <h3>Компонент списка юзеров</h3>

    <div class="users_cards">
        <div class="users_cards-card" *ngFor="let user of users">
            <p class="users_cards-name">{{$any(user).name}}</p>
            <p class="users_cards-email">{{$any(user).email}}</p>
            <p class="users_cards-website">{{$any(user).website}}</p>
            <button (click)="deleteUser($any(user).id)" class="users_cards-button">Удалить юзера</button>
        </div>
    </div>
</div>
