<h3 class="title_3">Добавить юзера</h3>

<form action="" class="create_user" [formGroup]="form" (ngSubmit)="submitForm()">
    <p class="create_user-label">Имя</p>
    <input type="text" class="create_user-input" placeholder="Введите имя" formControlName="name">

    <p class="create_user-label">Email</p>
    <input type="text" class="create_user-input" placeholder="Введите почту" formControlName="email">

    <p class="create_user-label">Website</p>
    <input type="text" class="create_user-input" placeholder="Введите веб-сайт" formControlName="website">

    <p class="create_user-label">Company</p>
    <div formGroupName="company">
        <input type="text" class="create_user-input" placeholder="Введите компанию" formControlName="name">
    </div>

    <button class="create_user-button" [disabled]="form.invalid">Добавить юзера</button>

</form>
